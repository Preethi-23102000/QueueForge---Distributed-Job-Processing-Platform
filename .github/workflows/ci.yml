name: CI

# Runs on direct pushes to main and on every pull request targeting main.
# When branch protection is enabled, the pull_request run becomes the merge gate.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # `verify` runs unit tests (Surefire) and Testcontainers integration tests
      # (Failsafe). The GitHub-hosted Ubuntu runner has Docker available, so the
      # Postgres and RabbitMQ containers spin up automatically.
      - name: Build and run tests
        run: mvn -B verify
